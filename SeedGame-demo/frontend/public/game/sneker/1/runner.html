<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SeedGame Runner</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0f172a;
            overflow: hidden;
            font-family: 'Courier New', monospace;
        }
        #game-container {
            width: 100%;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #status {
            position: absolute;
            top: 10px;
            right: 10px;
            color: #67e8f9;
            font-size: 11px;
            background: rgba(0,0,0,0.7);
            padding: 6px 12px;
            border-radius: 4px;
            z-index: 1000;
        }
        canvas {
            display: block;
            max-width: 100%;
            max-height: 100%;
            image-rendering: pixelated;
        }
    </style>
</head>
<body>
    <div id="status">Initializing game...</div>
    <div id="game-container"></div>

    <!-- Load Phaser -->
    <script src="https://cdn.jsdelivr.net/npm/phaser@v3.90.0/dist/phaser.js"></script>
    
    <!-- Load game with runner logic -->
    <script type="module" src="./main.js"></script>
</body>
</html>
